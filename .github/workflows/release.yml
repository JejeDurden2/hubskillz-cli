name: Release CLI

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hubskillz/shared build
      - run: pnpm --filter hubskillz build
      - run: pnpm --filter hubskillz test

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          test "cli-v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version $version"; exit 1; }

      - run: pnpm --filter hubskillz publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
