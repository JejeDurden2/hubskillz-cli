name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # next build validates the web env; any URL satisfies it here.
      API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Advisory only: a new upstream CVE must not block an unrelated PR.
      - run: pnpm audit --audit-level=high
        continue-on-error: true
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm build
      - run: pnpm test
